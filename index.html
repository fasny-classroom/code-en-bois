<!doctype html>
<html lang="fr">
<head>
  <style>
  /* must have size, or workspace is invisible */
  #blocklyDiv {
    height: 520px;
    width: 100%;
    position: relative;
    border: 1px solid #ccc;
    overflow: hidden; /* ok */
    z-index: 1;       /* ensure on top */
  }
  /* if you position the canvas near it, make sure it doesn't cover the toolbox */
  #canvas {
    position: relative;
    z-index: 0; /* lower than blockly */
  }
</style>
    <!-- Blockly core (must be first) -->
  <script src="https://unpkg.com/blockly@11.2.0/blockly.min.js"></script>
  <script>
    console.log("[probe] after blockly.min.js: Blockly =", !!window.Blockly);
  </script>

  <!-- Default blocks lib -->
  <script src="https://unpkg.com/blockly@11.2.0/blocks.min.js"></script>
  <script>
    console.log("[probe] after blocks.min.js: Blockly.Blocks =", !!(window.Blockly && window.Blockly.Blocks));
  </script>

  <!-- Python generator (primary URL) -->
  <script src="https://unpkg.com/blockly@11.2.0/python.min.js"></script>
  <script>
    console.log(
      "[probe] after python.min.js:",
      "Blockly.Python =", !!(window.Blockly && window.Blockly.Python),
      "forBlock =", !!(window.Blockly && window.Blockly.Python && window.Blockly.Python.forBlock)
    );
    // Fallback: some builds expose python_compressed.js instead of python.min.js
    if (!(window.Blockly && window.Blockly.Python && window.Blockly.Python.forBlock)) {
      console.warn("[probe] python.min.js did not expose Blockly.Python; loading fallback python_compressed.js…");
      var s = document.createElement('script');
      s.src = "https://unpkg.com/blockly@11.2.0/python_compressed.js";
      s.onload = function(){
        console.log(
          "[probe] after python_compressed.js:",
          "Blockly.Python =", !!(window.Blockly && window.Blockly.Python),
          "forBlock =", !!(window.Blockly && window.Blockly.Python && window.Blockly.Python.forBlock)
        );
      };
      s.onerror = function(){ console.error("[probe] failed to load python_compressed.js"); };
      document.head.appendChild(s);
    }
  </script>

  <!-- Pyodide (Python in the browser) -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
  <script>
    console.log("[probe] after pyodide.js: loadPyodide =", typeof window.loadPyodide);
  </script>

  <!-- Your app files (defer so they run after libs above) -->
  <script defer src="./js/grammar.js"></script>
  <script defer src="./js/blocks.js"></script>
  <script defer src="./js/app.js"></script>
</head>
<body>
  <header>
    <button id="runBtn">▶️ Run</button>
    <button id="resetBtn">↺ Reset</button>
  </header>
  <main>
    <div id="blocklyDiv"></div>
    <div><canvas id="canvas" width="480" height="480"></canvas></div>
  </main>
</body>
</html>
